          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AdicionarItem:
      type: object
      properties:
        id_variacao:
          type: integer
        quantidade:
          type: integer
          minimum: 1
      required:
      - id_variacao
      - quantidade
    AtualizarItem:
      type: object
      properties:
        quantidade:
          type: integer
          minimum: 1
      required:
      - quantidade
    Carrinho:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrinho'
          readOnly: true
        total:
          type: string
          readOnly: true
      required:
      - id
      - itens
      - total
    Categoria:
      type: object
      properties:
